apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacorp-frontend
  namespace: novacorp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novacorp-frontend
  template:
    metadata:
      labels:
        app: novacorp-frontend
    spec:
      containers:
        - name: frontend
          image: 716769866080.dkr.ecr.eu-west-2.amazonaws.com/cop-frontend:5af3984f9bf3caa6bd0eae3bdeb8adba53da177b
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi