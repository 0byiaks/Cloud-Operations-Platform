apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: novacorp-secrets
  namespace: novacorp
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "cop/novacorp/db-password"
        objectType: "secretsmanager"
      - objectName: "cop/novacorp/jwt-secret"
        objectType: "secretsmanager"
  secretObjects:
    - secretName: novacorp-secrets
      type: Opaque
      data:
        - objectName: "cop/novacorp/db-password"
          key: db-password
        - objectName: "cop/novacorp/jwt-secret"
          key: jwt-secret
    