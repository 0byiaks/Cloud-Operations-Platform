apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novacorp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/0byiaks/Cloud-Operations-Platform
    targetRevision: main
    path: kubernetes/novacorp
  destination:
    server: https://kubernetes.default.svc
    namespace: novacorp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true